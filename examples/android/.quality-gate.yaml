# Quality Gate Config for Android
minCoverage: "0"
autoFormat: "true"
runTestsOnPush: "no"
  # Catch gradle configuration issues quickly
  "*.gradle": "./gradlew properties --dry-run -q"
  "*.gradle.kts": "./gradlew properties --dry-run -q"
  # Run ktlint for kotlin files if installed
  "*.kt": "ktlint"
